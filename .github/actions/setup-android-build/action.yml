name: Set up Android build
description: Installs the Java and Android toolchain required by this project.

runs:
  using: composite
  steps:
    - name: Set up JDK 21
      uses: actions/setup-java@v5
      with:
        distribution: temurin
        java-version: '21'

    - name: Set up Gradle
      uses: gradle/actions/setup-gradle@v6

    - name: Set up Android SDK
      uses: android-actions/setup-android@v3

    - name: Install Android build tools
      shell: bash
      run: >-
        sdkmanager
        "platforms;android-36"
        "build-tools;36.0.0"
        "ndk;27.2.12479018"
        "cmake;3.22.1"
